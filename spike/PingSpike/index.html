<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ping Spike</title>
    <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
    <style>
      :root { --u: 1vmin; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #000; color: #fff;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: calc(var(--u) * 2);
        overflow: hidden; text-align: center;
      }
      #word {
        font-weight: 800; line-height: 1;
        font-size: clamp(22px, 34vmin, 96px);
        letter-spacing: 0.04em; color: #9aa0a6;
      }
      #detail {
        font-size: clamp(8px, 6.5vmin, 20px);
        opacity: 0.9; max-width: 96%;
        padding: 0 calc(var(--u) * 3); word-break: break-word;
      }
      #foot {
        position: absolute; bottom: calc(var(--u) * 3);
        font-size: clamp(7px, 4.5vmin, 13px); opacity: 0.5;
      }
      body.wait #word { color: #9aa0a6; }
      body.ok   #word { color: #34c759; }
      body.fail #word { color: #ff9f0a; }
      body.csp  #word { color: #ff375f; }
    </style>
  </head>
  <body class="wait">
    <div id="word">PING&#8230;</div>
    <div id="detail">starting&#8230;</div>
    <div id="foot">&#8203;</div>
    <script>
      (function () {
        var EP = "http://127.0.0.1:8787/ping";
        var elWord = document.getElementById("word");
        var elDetail = document.getElementById("detail");
        var elFoot = document.getElementById("foot");
        var attempts = 0;
        var cspHit = false;

        function setState(cls, word, detail) {
          document.body.className = cls;
          elWord.textContent = word;
          elDetail.textContent = detail;
        }
        function foot() {
          elFoot.textContent =
            location.protocol + "//" + (location.host || "(no host)") + "  •  try#" + attempts;
        }

        // Explicit signal: if a Content-Security-Policy blocks the request,
        // Chromium fires this BEFORE the fetch leaves the page.
        document.addEventListener("securitypolicyviolation", function (e) {
          var uri = e.blockedURI || "";
          var dir = e.violatedDirective || e.effectiveDirective || "";
          if (uri.indexOf("127.0.0.1") !== -1 || /connect|default/i.test(dir)) {
            cspHit = true;
            setState("csp", "CSP", dir + " → " + uri);
            foot();
          }
        });

        function ping() {
          attempts++;
          if (document.body.className !== "ok") setState("wait", "PING…", "contacting stub…");
          foot();
          fetch(EP + "?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) {
              return r.text().then(function (t) { return { status: r.status, body: t }; });
            })
            .then(function (o) {
              setState("ok", "OK", "HTTP " + o.status + "  " + o.body.slice(0, 90));
              foot();
            })
            .catch(function (err) {
              if (cspHit) {
                setState("csp", "CSP", "blocked before send • " + err.name);
              } else {
                setState("fail", "FAIL", (err.name || "Error") + ": " + (err.message || "no response"));
              }
              foot();
            });
        }

        ping();
        setInterval(ping, 3000);
      })();
    </script>
  </body>
</html>
